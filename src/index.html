<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>チョ～集中！チョット調理ジャン！～チャッ！🔥カリッ！🍳パリッ！～</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <!-- 表紙 -->
    <section id="screen-cover" class="screen" aria-label="表紙">
      <h1 class="title logo-title"><img class="logo" src="../assets/ui/title_logo.png" alt="チョ～集中！チョット調理ジャン！～チャッ！🔥カリッ！🍳パリッ！～"></h1>
      <img class="hero" src="../assets/chars/hero_normal.png" alt="見習い料理人">
      <div class="menu">
        <button id="btn-start" class="btn btn-main" type="button">はじめから</button>
        <button id="btn-continue" class="btn btn-main" type="button" hidden>つづきから</button>
        <button id="btn-tutorial" class="btn btn-sub" type="button">あそびかた</button>
      </div>
      <div class="menu menu-sub">
        <button id="btn-mute" class="btn btn-small" type="button">おと：あり</button>
        <button id="btn-sound" class="btn btn-small" type="button">せってい</button>
        <a class="btn btn-small" href="../support.html">サポート</a>
      </div>
      <p id="best" class="note"></p>
    </section>

    <!-- 遊ぶ画面 -->
    <section id="screen-play" class="screen" aria-label="プレイ" hidden>
      <canvas id="stage" width="960" height="540"></canvas>
      <div id="tut-bar" class="menu" hidden>
        <button id="tut-prev" class="btn btn-small" type="button">◀ もどる</button>
        <span id="tut-dots" class="tut-dots" aria-hidden="true"></span>
        <button id="tut-next" class="btn btn-main btn-small" type="button">つぎへ ▶</button>
        <button id="tut-skip" class="btn btn-small" type="button">スキップ</button>
      </div>
      <section id="quiz" class="quiz" aria-live="polite" hidden>
        <p class="quiz-head"><span id="quiz-step" class="quiz-step"></span><span id="quiz-left" class="quiz-left"></span></p>
        <p id="quiz-q" class="quiz-q"></p>
        <div id="quiz-feedback" hidden>
          <p id="quiz-verdict" class="verdict"></p>
          <p id="quiz-fail" class="quiz-fail"></p>
          <p id="quiz-power" class="quiz-power" hidden></p>
          <p id="quiz-reason" class="quiz-reason"></p>
        </div>
      </section>
      <div class="menu">
        <button id="btn-mute-play" class="btn btn-small" type="button">おと：あり(M)</button>
        <button id="btn-sound-play" class="btn btn-small" type="button">せってい</button>
        <button id="btn-quit" class="btn btn-small" type="button">やめる(Esc)</button>
      </div>
    </section>

    <!-- 結果画面 -->
    <section id="screen-result" class="screen" aria-label="結果" hidden>
      <h2 id="r-title" class="title"></h2>
      <img id="r-hero" class="hero" src="../assets/chars/hero_win.png" alt="">
      <p id="r-rank" class="rank"></p>
      <dl class="scores">
        <div><dt>とくてん</dt><dd id="r-score"></dd></div>
        <div><dt>パーフェクト</dt><dd id="r-perfect"></dd></div>
        <div><dt>グッド</dt><dd id="r-good"></dd></div>
        <div><dt>ミス</dt><dd id="r-miss"></dd></div>
        <div><dt>さいだいコンボ</dt><dd id="r-combo"></dd></div>
        <div><dt>手順えらび</dt><dd id="r-quiz"></dd></div>
        <div><dt>調理の しっぱい</dt><dd id="r-cook"></dd></div>
        <div><dt>さいこうとくてん</dt><dd id="r-best"></dd></div>
      </dl>
      <p id="r-record" class="record" hidden>しんきろく！</p>
      <section class="review" aria-label="ふりかえり">
        <h3>ふりかえり</h3>
        <ul id="r-review"></ul>
        <h3>ワンポイント</h3>
        <ul id="r-tips"></ul>
      </section>
      <div class="menu">
        <button id="btn-again" class="btn btn-main" type="button">もういちど</button>
        <button id="btn-cover" class="btn btn-sub" type="button">ひょうしへ</button>
      </div>
    </section>

  </main>
  <dialog id="dlg-sound" class="dialog" aria-labelledby="dlg-sound-title">
    <p id="dlg-sound-title" class="dlg-title">せってい</p>
    <div class="vols">
      <label class="vol"><span>BGM</span><input id="vol-bgm" type="range" min="0" max="100" step="1"><output></output></label>
      <label class="vol"><span>リズム</span><input id="vol-rhythm" type="range" min="0" max="100" step="1"><output></output></label>
      <label class="vol"><span>こうかおん</span><input id="vol-se" type="range" min="0" max="100" step="1"><output></output></label>
      <label class="vol"><span>タイミング</span><input id="set-offset" type="range" min="-200" max="200" step="10"><output></output></label>
    </div>
    <p id="offset-note" class="note" hidden>タイミングは、表紙で かえられるよ。</p>
    <div class="buttons">
      <button id="btn-sound-reset" class="btn btn-sub btn-small" type="button">初期設定にもどす</button>
      <button id="btn-sound-close" class="btn btn-main btn-small" type="button">もどる</button>
    </div>
  </dialog>
  <script type="module" src="main.js"></script>
</body>
</html>
